<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 운세</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Malgun Gothic", sans-serif;
            color: #f7f0dc;
            background:
                radial-gradient(circle at top, rgba(255, 214, 102, 0.18), transparent 35%),
                linear-gradient(160deg, #0e172f 0%, #13254c 55%, #1d3a6b 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .shell {
            width: min(100%, 860px);
            background: rgba(10, 18, 38, 0.82);
            border: 1px solid rgba(255, 230, 170, 0.18);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .hero {
            padding: 40px 32px 24px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 215, 128, 0.08), transparent);
        }

        .eyebrow {
            letter-spacing: 0.24em;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: #f5cf7a;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.2rem);
            color: #fff4d0;
        }

        .subtitle {
            margin: 14px auto 0;
            max-width: 560px;
            line-height: 1.7;
            color: rgba(255, 244, 208, 0.78);
        }

        .content {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
        }

        .panel {
            padding: 28px 28px 32px;
        }

        .form-panel {
            border-right: 1px solid rgba(255, 230, 170, 0.12);
            background: rgba(255, 255, 255, 0.02);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #f8e7b5;
        }

        input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 230, 170, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #ffd66b;
            box-shadow: 0 0 0 4px rgba(255, 214, 107, 0.14);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px 18px;
            border: 0;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            color: #13254c;
            background: linear-gradient(135deg, #ffe19a, #f6b93b);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 14px 32px rgba(246, 185, 59, 0.25);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.8;
        }

        .helper {
            margin-top: 14px;
            font-size: 0.88rem;
            line-height: 1.6;
            color: rgba(255, 244, 208, 0.65);
        }

        .result-panel {
            min-height: 420px;
        }

        .placeholder,
        .error {
            display: grid;
            place-items: center;
            min-height: 100%;
            text-align: center;
            color: rgba(255, 244, 208, 0.7);
            line-height: 1.8;
        }

        .error {
            color: #ffcfbf;
        }

        .fortune-card {
            display: none;
        }

        .fortune-card.visible {
            display: block;
        }

        .date-line {
            color: #f5cf7a;
            font-size: 0.92rem;
            margin-bottom: 10px;
        }

        .summary {
            margin: 0 0 20px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #fff8e6;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .score-box,
        .detail-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 230, 170, 0.14);
            border-radius: 18px;
            padding: 16px;
        }

        .score-label {
            color: rgba(255, 244, 208, 0.7);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .score-value {
            font-size: 1.6rem;
            color: #ffd66b;
            font-weight: 700;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail-box h2 {
            margin: 0 0 8px;
            font-size: 1rem;
            color: #fff1c7;
        }

        .detail-box p {
            margin: 0;
            line-height: 1.7;
            color: rgba(255, 244, 208, 0.84);
        }

        .luck-row {
            margin-top: 12px;
            padding: 16px 18px;
            border-radius: 18px;
            background: rgba(255, 214, 107, 0.08);
            color: #fff3d4;
            line-height: 1.8;
        }

        .loading {
            display: none;
            margin-top: 14px;
            color: rgba(255, 244, 208, 0.72);
            font-size: 0.92rem;
        }

        .loading.visible {
            display: block;
        }

        @media (max-width: 760px) {
            .content {
                grid-template-columns: 1fr;
            }

            .form-panel {
                border-right: 0;
                border-bottom: 1px solid rgba(255, 230, 170, 0.12);
            }

            .score-grid,
            .detail-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 520px) {
            .hero,
            .panel {
                padding-left: 20px;
                padding-right: 20px;
            }

            .score-grid,
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="hero">
            <div class="eyebrow">Daily Fortune</div>
            <h1>생일로 보는 오늘의 운세</h1>
            <p class="subtitle">생일을 입력하면 오늘 날짜 기준으로 운세를 분석해 보여줍니다. 같은 날에는 같은 결과가 나오도록 구성했습니다.</p>
        </section>

        <section class="content">
            <div class="panel form-panel">
                <form id="fortune-form">
                    <label for="birth_date">생일</label>
                    <input type="date" id="birth_date" name="birth_date" min="1900-01-01" required>
                    <button type="submit" id="submit-btn">오늘의 운세 보기</button>
                </form>
                <div class="loading" id="loading">운세를 계산하는 중입니다...</div>
                <p class="helper">입력한 생일과 오늘 날짜를 기준으로 총운, 금전운, 연애운, 건강운을 보여줍니다.</p>
            </div>

            <div class="panel result-panel">
                <div class="placeholder" id="placeholder">
                    생일을 입력하면 이곳에 오늘의 운세가 표시됩니다.
                </div>
                <div class="error" id="error" hidden></div>

                <article class="fortune-card" id="fortune-card">
                    <div class="date-line" id="date-line"></div>
                    <p class="summary" id="opening"></p>

                    <div class="score-grid">
                        <div class="score-box">
                            <div class="score-label">총운</div>
                            <div class="score-value" id="total-score"></div>
                        </div>
                        <div class="score-box">
                            <div class="score-label">금전운</div>
                            <div class="score-value" id="money-score"></div>
                        </div>
                        <div class="score-box">
                            <div class="score-label">연애운</div>
                            <div class="score-value" id="love-score"></div>
                        </div>
                        <div class="score-box">
                            <div class="score-label">건강운</div>
                            <div class="score-value" id="health-score"></div>
                        </div>
                    </div>

                    <div class="detail-grid">
                        <section class="detail-box">
                            <h2>금전운</h2>
                            <p id="money-text"></p>
                        </section>
                        <section class="detail-box">
                            <h2>연애운</h2>
                            <p id="love-text"></p>
                        </section>
                        <section class="detail-box">
                            <h2>건강운</h2>
                            <p id="health-text"></p>
                        </section>
                        <section class="detail-box">
                            <h2>오늘의 조언</h2>
                            <p id="advice-text"></p>
                        </section>
                    </div>

                    <div class="luck-row" id="luck-row"></div>
                </article>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById("fortune-form");
        const submitBtn = document.getElementById("submit-btn");
        const loading = document.getElementById("loading");
        const placeholder = document.getElementById("placeholder");
        const errorBox = document.getElementById("error");
        const card = document.getElementById("fortune-card");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = new FormData(form);
            submitBtn.disabled = true;
            loading.classList.add("visible");
            errorBox.hidden = true;
            card.classList.remove("visible");
            placeholder.hidden = true;

            try {
                const response = await fetch("/fortune", {
                    method: "POST",
                    body: formData,
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "운세를 불러오지 못했습니다.");
                }

                document.getElementById("date-line").textContent =
                    `${data.today} · 생일 ${data.birth_date}`;
                document.getElementById("opening").textContent = data.opening;
                document.getElementById("total-score").textContent = `${data.total_score}점`;
                document.getElementById("money-score").textContent = `${data.money_score}점`;
                document.getElementById("love-score").textContent = `${data.love_score}점`;
                document.getElementById("health-score").textContent = `${data.health_score}점`;
                document.getElementById("money-text").textContent = data.money;
                document.getElementById("love-text").textContent = data.love;
                document.getElementById("health-text").textContent = data.health;
                document.getElementById("advice-text").textContent = data.advice;
                document.getElementById("luck-row").textContent =
                    `행운의 색: ${data.lucky_color} · 행운의 아이템: ${data.lucky_item}`;

                card.classList.add("visible");
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.hidden = false;
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove("visible");
            }
        });
    </script>
</body>
</html>
